version: 2.1

orbs:
  node: circleci/node@5.1.0

# Define custom executors
executors:
  node-builder:
    docker:
      - image: cimg/node:20.11.0 # Using Node v20 LTS for modern Vite builds
    resource_class: large # Vite bundler can be memory intensive

jobs:
  build-and-test:
    executor: node-builder
    working_directory: ~/repo/frontend
    steps:
      - checkout:
          path: ~/repo
          
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/.npm

      - run:
          name: Print Node & NPM versions
          command: |
             node -v
             npm -v

      - run:
          name: Type Check (TypeScript)
          command: npm run build -- --logLevel error # Note: vite build includes tsc -b by default

      - run:
          name: Run Unit Tests
          command: echo "Testing framework (e.g. Vitest) would run here"

      - persist_to_workspace:
          root: ~/repo/frontend
          paths:
            - dist
            - node_modules

  deploy-to-cdn:
    executor: node-builder
    working_directory: ~/repo/frontend
    steps:
      - attach_workspace:
          at: ~/repo/frontend
          
      - run:
          name: Deploy Web Application
          command: |
            echo "Uploading ~/repo/frontend/dist to S3/CDN..."
            # aws s3 sync dist/ s3://gamereel-frontend-prod --delete
            echo "Invalidating CloudFront Cache..."
            # aws cloudfront create-invalidation --distribution-id $CF_ID --paths "/*"
            echo "Deployment successful!"

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - main
                - dev

      - deploy-to-cdn:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main # Only deploy on main branch commits
