# ============================================================
# GameReel — Nginx API Gateway
# Reverse proxy for all 5 microservices
# Rate limiting, WebSocket upgrade, CORS
# ============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m        rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth:10m       rate=20r/m;
limit_req_zone $binary_remote_addr zone=upload:10m     rate=300r/m;
limit_req_zone $binary_remote_addr zone=search:10m     rate=60r/m;

# Upstream definitions
upstream user_service {
  server user-service:3001;
  keepalive 32;
}

upstream game_service {
  server game-service:3002;
  keepalive 32;
}

upstream feed_service {
  server feed-service:3003;
  keepalive 32;
}

upstream social_service {
  server social-service:3004;
  keepalive 32;
}

upstream upload_service {
  server upload-service:3005;
  keepalive 32;
}

# Logging format
log_format gamereel_format '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rt=$request_time uct="$upstream_connect_time" '
                'uht="$upstream_header_time" urt="$upstream_response_time"';

server {
  listen 80;
  server_name _;

  # Docker DNS resolver (refresh upstream IPs after container restarts)
  resolver 127.0.0.11 valid=10s ipv6=off;

  access_log  /var/log/nginx/access.log gamereel_format;
  error_log   /var/log/nginx/error.log warn;

  # ── Security headers ──────────────────────────────────────────
  add_header X-Content-Type-Options    "nosniff"      always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  # ── CORS — allow frontend dev server ────────────────────────
  set $cors_origin "";
  if ($http_origin ~* "^(http://localhost:[0-9]+|https://gamereel\.app)$") {
    set $cors_origin $http_origin;
  }
  add_header Access-Control-Allow-Origin      $cors_origin always;
  add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Session-ID, X-Chunk-Index, X-Total-Chunks" always;
  add_header Access-Control-Allow-Credentials "true" always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  # ── Max upload body size (200 MB) ────────────────────────────
  client_max_body_size 210M;
  client_body_timeout  300s;

  # ── Health check (gateway level) ─────────────────────────────
  location = /health {
    return 200 '{"status":"ok","service":"nginx-gateway"}';
    add_header Content-Type application/json;
  }

  # ── user-service ─────────────────────────────────────────────
  location /api/auth {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    add_header X-Frame-Options "SAMEORIGIN" always;

    set $user_upstream user-service:3001;
    rewrite ^/api/auth/?(.*) /$1 break;
    proxy_pass         http://$user_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /api/users {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    set $user_upstream user-service:3001;
    rewrite ^/api/users/?(.*) /$1 break;
    proxy_pass         http://$user_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── game-service ──────────────────────────────────────────────
  location /api/games {
    limit_req zone=api burst=30 nodelay;
    limit_req_status 429;

    set $game_upstream game-service:3002;
    rewrite ^/api/games/?(.*) /games/$1 break;
    proxy_pass         http://$game_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /api/search {
    limit_req zone=search burst=10 nodelay;
    limit_req_status 429;

    set $game_upstream game-service:3002;
    rewrite ^/api/search/?(.*) /search/$1 break;
    proxy_pass         http://$game_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── feed-service ──────────────────────────────────────────────
  location /api/feed {
    limit_req zone=api burst=30 nodelay;
    limit_req_status 429;

    set $feed_upstream feed-service:3003;
    rewrite ^/api/feed/?(.*) /feed/$1 break;
    proxy_pass         http://$feed_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── social-service (REST + WebSocket) ─────────────────────────
  location /api/social {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    set $social_upstream social-service:3004;
    rewrite ^/api/social/?(.*) /$1 break;
    proxy_pass         http://$social_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # WebSocket upgrade for Socket.io
  location /socket.io/ {
    set $social_upstream social-service:3004;
    proxy_pass         http://$social_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;  # 24h for long-lived WebSocket connections
    proxy_send_timeout 86400s;
  }

  # ── upload-service ────────────────────────────────────────────
  location /api/upload {
    limit_req zone=upload burst=30 nodelay;
    limit_req_status 429;

    set $upload_upstream upload-service:3005;
    rewrite ^/api/upload/?(.*) /upload/$1 break;
    proxy_pass            http://$upload_upstream;
    proxy_http_version    1.1;
    proxy_set_header      Connection "";
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_request_buffering off;            # stream chunks upstream
    client_body_in_file_only off;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
  }

  # ── MinIO public assets (proxy) ───────────────────────────────
  location /game-assets/ {
    # Strip MinIO's own CORS headers to prevent duplicates with nginx's
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    proxy_pass         http://minio:9000;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── Frontend (dev: proxy to Vite, prod: serve static) ─────────
  location / {
    proxy_pass         http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade     $http_upgrade;
    proxy_set_header   Connection  "upgrade";  # Vite HMR WebSocket
    proxy_set_header   Host        $host;
    proxy_cache_bypass $http_upgrade;
  }

  # ── Error pages ───────────────────────────────────────────────
  error_page 429 /errors/429.json;
  error_page 502 503 504 /errors/5xx.json;

  location = /errors/429.json {
    internal;
    return 429 '{"success":false,"error":"Rate limit exceeded. Please slow down."}';
    add_header Content-Type application/json;
    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Session-ID, X-Chunk-Index, X-Total-Chunks" always;
    add_header Access-Control-Allow-Credentials "true" always;
  }

  location = /errors/5xx.json {
    internal;
    return 502 '{"success":false,"error":"Service temporarily unavailable"}';
    add_header Content-Type application/json;
    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Session-ID, X-Chunk-Index, X-Total-Chunks" always;
    add_header Access-Control-Allow-Credentials "true" always;
  }
}
