# ============================================================
# GameReel — docker-compose.yml (Development)
# 14 services | 3 networks | hot-reload volumes
# ============================================================
# Usage:
#   make dev-setup   → First-time setup
#   make up          → Start all services
#   make down        → Stop
# ============================================================

name: gamereel

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - internal_net
  environment: &env-defaults
    NODE_ENV: development
    LOG_LEVEL: ${LOG_LEVEL:-debug}

x-db-env: &db-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-gamereel}
  POSTGRES_USER: ${POSTGRES_USER:-gamereel}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_password}

x-rabbit-env: &rabbit-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-gamereel}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-changeme_rabbit_password}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

x-minio-env: &minio-env
  MINIO_HOST: ${MINIO_HOST:-minio}
  MINIO_PORT: ${MINIO_PORT:-9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gamereel_access}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme_minio_secret}
  MINIO_BUCKET: ${MINIO_BUCKET:-game-assets}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}

x-elastic-env: &elastic-env
  ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-elasticsearch}
  ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
  ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-games}

services:

  # ──────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: gamereel-postgres
    restart: unless-stopped
    networks:
      - internal_net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamereel}
      POSTGRES_USER: ${POSTGRES_USER:-gamereel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamereel} -d ${POSTGRES_DB:-gamereel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gamereel-redis
    restart: unless-stopped
    networks:
      - internal_net
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gamereel-rabbitmq
    restart: unless-stopped
    networks:
      - internal_net
      - mq_net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gamereel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme_rabbit_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gamereel-minio
    restart: unless-stopped
    networks:
      - internal_net
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-gamereel_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: gamereel-minio-init
    networks:
      - internal_net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-gamereel_access} ${MINIO_SECRET_KEY:-changeme_minio_secret};
        mc mb --ignore-existing local/${MINIO_BUCKET:-game-assets};
        mc anonymous set download local/${MINIO_BUCKET:-game-assets}/games;
        mc ilm import local/${MINIO_BUCKET:-game-assets} <<EOF
        {\"Rules\":[{\"Expiration\":{\"Days\":1},\"Filter\":{\"Prefix\":\"uploads/temp/\"},\"Status\":\"Enabled\",\"ID\":\"expire-temp-chunks\"}]}
        EOF
        echo 'MinIO initialized.';
      "
    restart: on-failure

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: gamereel-elasticsearch
    restart: unless-stopped
    networks:
      - internal_net
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTICSEARCH_INDEX=${ELASTICSEARCH_INDEX:-games}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Microservices
  # ──────────────────────────────────────────────────────────

  user-service:
    <<: *service-defaults
    build:
      context: ./services/user-service
      target: development
    container_name: gamereel-user-service
    networks:
      - internal_net
    environment:
      <<: [*env-defaults, *db-env, *rabbit-env]
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_minimum_32_characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_refresh_secret_minimum_32_characters}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
    volumes:
      - ./services/user-service/src:/app/src:ro
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  game-service:
    <<: *service-defaults
    build:
      context: ./services/game-service
      target: development
    container_name: gamereel-game-service
    networks:
      - internal_net
    environment:
      <<: [*env-defaults, *db-env, *minio-env, *elastic-env]
      PORT: 3002
    volumes:
      - ./services/game-service/src:/app/src:ro
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  feed-service:
    <<: *service-defaults
    build:
      context: ./services/feed-service
      target: development
    container_name: gamereel-feed-service
    networks:
      - internal_net
    environment:
      <<: [*env-defaults, *db-env, *redis-env, *rabbit-env]
      PORT: 3003
    volumes:
      - ./services/feed-service/src:/app/src:ro
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  social-service:
    <<: *service-defaults
    build:
      context: ./services/social-service
      target: development
    container_name: gamereel-social-service
    networks:
      - internal_net
    environment:
      <<: [*env-defaults, *db-env, *redis-env, *rabbit-env]
      PORT: 3004
    volumes:
      - ./services/social-service/src:/app/src:ro
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  upload-service:
    <<: *service-defaults
    build:
      context: ./services/upload-service
      target: development
    container_name: gamereel-upload-service
    networks:
      - internal_net
    environment:
      <<: [*env-defaults, *db-env, *rabbit-env, *minio-env]
      PORT: 3005
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-209715200}
      UPLOAD_CHUNK_SIZE_BYTES: ${UPLOAD_CHUNK_SIZE_BYTES:-5242880}
      UPLOAD_MAX_PER_DAY: ${UPLOAD_MAX_PER_DAY:-10}
      UPLOAD_MAX_CONCURRENT: ${UPLOAD_MAX_CONCURRENT:-5}
    volumes:
      - ./services/upload-service/src:/app/src:ro
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Background Workers
  # ──────────────────────────────────────────────────────────

  game-processor:
    <<: *service-defaults
    build:
      context: ./workers/game-processor
      target: development
    container_name: gamereel-game-processor
    networks:
      - internal_net
      - mq_net
    environment:
      <<: [*env-defaults, *db-env, *rabbit-env, *minio-env, *elastic-env]
    volumes:
      - ./workers/game-processor/src:/app/src:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  notification-worker:
    <<: *service-defaults
    build:
      context: ./workers/notification-worker
      target: development
    container_name: gamereel-notification-worker
    networks:
      - internal_net
      - mq_net
    environment:
      <<: [*env-defaults, *db-env, *rabbit-env]
      # Full Firebase service account JSON (stringified)
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    volumes:
      - ./workers/notification-worker/src:/app/src:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: gamereel-frontend
    networks:
      - public_net
      - internal_net
    environment:
      VITE_API_URL: http://localhost:80
      VITE_WS_URL: ws://localhost:80
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    ports:
      - "5173:5173"

  # ──────────────────────────────────────────────────────────
  # API Gateway
  # ──────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: gamereel-nginx
    restart: unless-stopped
    networks:
      - public_net
      - internal_net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - user-service
      - game-service
      - feed-service
      - social-service
      - upload-service
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5

# ──────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────

networks:
  public_net:
    driver: bridge
    name: gamereel_public
  internal_net:
    driver: bridge
    name: gamereel_internal
    internal: true
  mq_net:
    driver: bridge
    name: gamereel_mq

# ──────────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────────

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
