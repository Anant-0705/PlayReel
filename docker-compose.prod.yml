# ============================================================
# GameReel — docker-compose.prod.yml (Production Overrides)
# Apply with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================
# Key differences from development:
#   • All services use 'production' build target (small images)
#   • No source volume mounts (code baked into image)
#   • No ports exposed except nginx:80
#   • Workers scale to multiple replicas
#   • Resource limits enforced
#   • Log drivers set for production
# ============================================================

name: gamereel

services:

  # ── Infrastructure: same images, no port exposure ──────────

  postgres:
    ports: !reset []   # No external access in production

  redis:
    ports: !reset []

  rabbitmq:
    ports: !reset []   # Only management UI exposed is blocked too

  minio:
    ports: !reset []

  elasticsearch:
    ports: !reset []
    environment:
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"   # More RAM in prod

  # ── Microservices: production build, no hot-reload ─────────

  user-service:
    build:
      target: production
    volumes: !reset []   # No source mounts
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3

  game-service:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  feed-service:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  social-service:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  upload-service:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    deploy:
      replicas: 1   # Upload sessions are stateful
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  # ── Workers: scalable replicas ─────────────────────────────

  game-processor:
    build:
      target: production
    volumes: !reset []
    deploy:
      replicas: 3   # Scale horizontally — each processes independently
      resources:
        limits:
          cpus: "1.0"
          memory: 1G   # Headless Chromium needs memory
        reservations:
          memory: 512M

  notification-worker:
    build:
      target: production
    volumes: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 64M

  # ── Frontend: serve built static files via nginx ───────────

  frontend:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    environment:
      VITE_API_URL: https://gamereel.app
      VITE_WS_URL: wss://gamereel.app
    deploy:
      replicas: 1

  # ── Nginx: add SSL and production caching ──────────────────

  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
